name: CI

# Runs on every push to main and every pull request. Must stay green for
# Phase 0 acceptance criterion #5.
#
# What runs: typecheck → lint → tests → production build. No DB access —
# the `db-ping` script is a local-only manual check.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 ships with npm 10.9+, which fixes a known cross-platform
          # optional-deps bug in `npm ci` (e.g. missing @esbuild/linux-x64
          # entries when the lockfile is generated on macOS). Node 22 also
          # matches Vercel's default for new projects.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) because the lockfile is generated
        # on macOS where npm doesn't write Linux-only @esbuild/* optional
        # platform entries — `npm ci` strictly verifies the lockfile and
        # fails on the missing entries. `npm install` reconciles instead.
        # This matches Vercel's default install command.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummies for module-load-time env var checks. No runtime calls
          # happen during build; these just satisfy throws in lib/stripe.ts
          # and lib/supabase/server.ts.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key
          STRIPE_SECRET_KEY: sk_test_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          PLAID_CLIENT_ID: ci_dummy
          PLAID_SECRET: ci_dummy
          CRON_SECRET: ci_dummy
          DWOLLA_KEY: ci_dummy
          DWOLLA_SECRET: ci_dummy
